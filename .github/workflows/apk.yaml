name: Costruisci APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: unzip -o progetto.zip -d progetto && cd progetto && chmod +x gradlew && ./gradlew --no-daemon assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk ../ScacchiAVoce.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          files: ScacchiAVoce.apk
          make_latest: true
