name: Costruisci APK
on: [push, workflow_dispatch]
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Costruisci
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          unzip -o progetto.zip -d progetto 2>&1 | tail -3 | tee build.log
          cd progetto && chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a ../build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../ScacchiAVoce.apk
      - name: Pubblica APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          files: ScacchiAVoce.apk
          make_latest: true
      - name: Segnala errore
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -n 120 build.log 2>/dev/null || echo "nessun log"; echo '```'; } > errore.md
          gh issue create --title "Costruzione fallita ${{ github.run_id }}" --body-file errore.md
